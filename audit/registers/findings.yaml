- id: F-025
  title: Harness manual propose masks proposer internal errors as timeouts
  severity: P1
  class: harness
  status: fixed
  confidence: high
  components:
  - harness/deploy.py
  arms:
  - all
  hazards:
  - HZ-029
  - HZ-034
  - HZ-035
  invariants:
  - INV-11
  evidence_level: E2
  evidence:
  - kind: source
    ref: harness/deploy.py
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/node.log
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/install-baseline.log
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/install-no-manual-propose.log
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
  - kind: status
    ref: audit/evidence/2026-11-05-install-rca/status.json
  - kind: rca
    ref: audit/registers/rca.yaml#RCA-001
  description: 'deploy_and_wait always called the manual propose endpoint. The node
    advertised autopropose true and manualPropose false (status.json), so that call
    raced the node proposer. A deploy whose proposal failed remained Pooled until the
    180-second timeout, and the harness reported only the timeout, hiding the node
    internal `decode continuation failed` error. Fix: _manual_propose defaults to
    false and calls the endpoint only when configured or RSURE_FORCE_PROPOSE=1. The
    no-manual-propose run isolated the masking; install-recursion-fix.log then
    completed all 17 terms.'
  preconditions: The node advertises autopropose and the harness is not configured to
    force manual propose.
  impact: Install failures are misattributed to the term being deployed; operators
    cannot distinguish a platform codec failure from a contract refusal.
  proposed_fix: R-025
  reviewer: internal
  verified_at: '2026-11-05'
