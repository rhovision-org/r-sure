- id: F-022
  title: RSpace continuation decode fails on a deep normalized Par
  severity: P0
  class: platform
  status: fixed
  confidence: high
  components:
  - RNodeRust
  - SureRoot
  arms:
  - all
  hazards:
  - HZ-028
  - HZ-032
  invariants:
  - INV-11
  evidence_level: E2
  evidence:
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/node.log
  - kind: log
    ref: audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
  - kind: source
    ref: ../RNodeRust/models/Cargo.toml
  - kind: source
    ref: ../RNodeRust/models/src/wire.rs
  - kind: test
    ref: audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
  - kind: rca
    ref: audit/registers/rca.yaml#RCA-001
  description: >-
    RNodeRust's Par wire codec used prost's default decode recursion limit
    (100). A deploy term such as 10_syndicate normalizes to a Par nested deeper than
    100; encoding succeeds, but decoding the RSpace continuation fails on the next
    proposal. node.log records 94 consecutive `decode continuation failed` proposer
    errors. Fix: models/Cargo.toml enables prost `no-recursion-limit`; a 130-deep Par
    round-trip regression was added in rholang/tests/deep_par_codec.rs. After the
    rebuilt node, install-recursion-fix.log shows all 17 terms installed.
  preconditions: A deploy term normalizes to a Par nested deeper than 100 and the node
    proposes the following block.
  impact: The proposer cannot build the next block. The chain does not advance, every
    later deploy stays Pooled, and the install cannot complete.
  proposed_fix: R-022
  reviewer: internal
  verified_at: '2026-11-05'
