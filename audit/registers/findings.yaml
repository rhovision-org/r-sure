  - kind: log
    ref: audit/evidence/2026-11-07-reviewer-defects/subscription-over.log
  description: Slip.subscribe checked only the individual 1..10000 bps bound. The running
    sum was computed after the share was stored and used only for the status label, so a
    second syndicate could push the total above 10000. Slip.bind requires exactly 10000 and
    the slip has no arm to reduce or remove a subscription, leaving it permanently
    un-bindable and the requested capacity reserved in the syndicate.
  preconditions: A syndicate manager subscribes while the existing shares already sum near
    10000.
  impact: The slip can never bind and the extra quote's capacity stays committed.
