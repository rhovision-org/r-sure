    ref: tools/check_bundle_closedness.py
  - kind: rca
    ref: audit/registers/rca.yaml#RCA-001
  description: 'The bundled Risk body received the auth reply with a wildcard binder,
    `for (@(true, _) <- aCh)`, which is open under the wildcard-binder bundle class.
    The 12_risk deploy was the first term rejected after 11_broker in the baseline
    install. Fix: replace the wildcard with the named binder `who` in every Risk auth
    arm; the term now deploys in the 17-term install.'
  preconditions: The installer deploys 12_risk.rho.
  impact: The Risk deploy is rejected, install stops before Slip and Line, and risk
    submission is unavailable.
  proposed_fix: R-023
  reviewer: internal
  verified_at: '2026-11-05'
