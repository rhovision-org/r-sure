- id: HZ-028
  node: N16
  guide_word: LOST
  parameter: continuation
  deviation: The proposer cannot decode the RSpace continuation of the next block, so
    no block is produced and the deploy stays Pooled.
  causes:
  - kind: root
    cause: RNodeRust used prost's default decode recursion limit (100) for the Par wire
      codec; the default is lower than the normalized Par depth the contracts produce.
    evidence: ../RNodeRust/models/Cargo.toml; ../RNodeRust/models/src/wire.rs
  - kind: contributing
    cause: 10_syndicate normalizes to a Par nested deeper than 100, so encoding succeeds
      while decoding the continuation fails.
    evidence: audit/evidence/2026-11-05-install-rca/node.log
  - kind: contributing
    cause: No regression test decoded a deeply nested Par, so the codec limit was never
      exercised on the RSpace path.
    evidence: audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
  - kind: direct
    cause: The harness timed out the Pooled deploy and called manual propose, which raced
      the node proposer and hid the internal decode error.
    evidence: audit/evidence/2026-11-05-install-rca/install-baseline.log
  consequences:
  - the chain does not advance; install stops at 12_risk
  - every later deploy remains Pooled until timeout
  severity: high
  likelihood: high
  risk: critical
  controls:
  - prost no-recursion-limit in RNodeRust models
  - rholang/tests/deep_par_codec.rs 130-deep round-trip
  - pinned node image digest audit/evidence/2026-11-05-install-rca/node-image.txt
  - autopropose-aware harness
  findings:
  - F-022
  - F-025
  tests:
  - T-037
  - T-038
  disposition: mitigate
  owner: platform-node
  evidence:
  - audit/evidence/2026-11-05-install-rca/node.log
  - audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
  arm: install@"pipeline"
- id: HZ-029
  node: N16
  guide_word: UNAVAILABLE
  parameter: deploy result
  deviation: A deploy whose proposal failed is reported to the operator as a 180-second
    Pooled timeout, not as the node's internal proposer error.
  causes:
  - kind: direct
    cause: wait_processed only distinguishes NotProcessed/unknown and has no branch for a
      proposer internal error.
    evidence: harness/deploy.py
  - kind: contributing
    cause: The harness called the manual propose endpoint even when the node advertised
      autopropose true and manualPropose false.
    evidence: harness/deploy.py
  consequences:
  - install failures are misattributed to the contract being deployed
  - operators cannot tell a codec/platform failure from a contract refusal
  severity: medium
  likelihood: high
  risk: high
  controls:
  - propose only when configured or RSURE_FORCE_PROPOSE=1
  - RSURE_STRICT_PROPOSE=1 for diagnosis
  - evidence v2 results require the node status and node log
  findings:
  - F-025
  tests:
  - T-037
  - T-039
  disposition: mitigate
  owner: harness
  evidence:
  - harness/deploy.py
  - audit/evidence/2026-11-05-install-rca/install-no-manual-propose.log
  arm: install@"pipeline"
- id: HZ-030
  node: N17
  guide_word: PART OF
  parameter: bundle binding
  deviation: The bundled Risk body uses a wildcard receive for the auth reply, leaving
    the bundle body open under the wildcard-binder class; 12_risk is rejected.
  causes:
  - kind: direct
    cause: Risk arms received the auth reply as `for (@(true, _) <- aCh)` instead of a
      named binder.
    evidence: contracts/src/deploy/12_risk.rho
  - kind: contributing
    cause: The static bundle scanner modelled free names but not the wildcard-binder
      bundle class.
    evidence: tools/check_bundle_closedness.py
  consequences:
  - 12_risk deploy is rejected; install stops before Slip and Line
  - Risk submission is unavailable
  severity: high
  likelihood: high
  risk: high
  controls:
  - named auth binder in Risk arms
  - install E2 over all 17 terms
  - tools/check_bundle_closedness.py
  findings:
  - F-023
  tests:
  - T-037
  disposition: mitigate
  owner: contracts
  evidence:
  - contracts/src/deploy/12_risk.rho
  - audit/evidence/2026-11-05-install-rca/install-baseline.log
  - audit/evidence/2026-11-05-install-rca/install-recursion-fix.log
  arm: Risk@"addEvidence"
