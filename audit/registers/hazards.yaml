- id: HZ-032
  node: N18
  guide_word: OTHER THAN
  parameter: parser depth
  deviation: The wire codec imposes a second, lower depth limit than the parser and
    normalizer; the platform contract is inconsistent across layers.
  causes:
  - kind: root
    cause: prost's default recursion limit applied only on decode; the encode path had no
      matching limit.
    evidence: ../RNodeRust/models/src/wire.rs
  - kind: contributing
    cause: The parser/normalizer depth contract was not documented in the codec layer.
    evidence: audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
  consequences:
  - a valid deploy term can encode but not be read back
  - node proposer stalls on the next block
  severity: high
  likelihood: medium
  risk: high
  controls:
  - prost no-recursion-limit
  - deep Par decode regression
  findings:
  - F-022
  tests:
  - T-038
  disposition: mitigate
  owner: platform-node
  evidence:
  - ../RNodeRust/models/Cargo.toml
  - audit/evidence/2026-11-05-install-rca/node/deep_par_codec.rs
  arm: install@"codec"
- id: HZ-033
  node: N18
  guide_word: OTHER THAN
  parameter: parser depth
  deviation: The r-cash 51_pool term exceeds the node parser depth; the r-cash bootstrap
    stops after installing the account factory and refuses the pool.
  causes:
  - kind: root
    cause: The r-cash 51_pool term is deeper than the node parser depth limit.
    evidence: audit/evidence/2026-11-05-install-rca/rcash-bootstrap-recursion-fix.log
  - kind: contributing
    cause: The r-cash installer treats an upstream parse refusal as a rail bootstrap stop;
      the r-sure install does not depend on the pool.
    evidence: harness/rcash_bootstrap.py
  consequences:
  - the r-cash pool/market rail is absent from this devnet
  - r-sure install and the 17 terms are unaffected
  severity: medium
  likelihood: high
  risk: medium
  controls:
  - r-cash account factory bootstrap verified
  - residual risk recorded; upstream r-cash parser-depth fix required
  - harness refuses to claim a full r-cash rail
  findings: []
  tests:
  - T-037
  disposition: open
  owner: external-rcash
  evidence:
  - audit/evidence/2026-11-05-install-rca/rcash-bootstrap-recursion-fix.log
  arm: Payments@"health"
- id: HZ-034
  node: N19
  guide_word: UNAVAILABLE
  parameter: propose mode
  deviation: The harness calls manual propose when the node advertises autopropose and
    manualPropose=false, racing the node's proposer.
  causes:
  - kind: direct
    cause: deploy_and_wait unconditionally called _propose_once.
    evidence: harness/deploy.py
  - kind: contributing
    cause: The status document was read for retries but its autopropose/manualPropose
      flags were not used to decide whether to propose.
    evidence: audit/evidence/2026-11-05-install-rca/status.json
  consequences:
  - an extra proposal races the node proposer
  - the real node error is replaced by a generic timeout
  severity: medium
  likelihood: high
  risk: high
  controls:
  - _manual_propose reads config or RSURE_FORCE_PROPOSE=1 and defaults to false
  - no-manual-propose run recorded
  findings:
  - F-025
  tests:
  - T-039
  disposition: mitigate
  owner: harness
  evidence:
  - audit/evidence/2026-11-05-install-rca/install-no-manual-propose.log
  arm: install@"propose"
- id: HZ-035
  node: N19
  guide_word: STALE
  parameter: evidence scope
  deviation: Install-green evidence can be read as behavioural coverage while all 36
