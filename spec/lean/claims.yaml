  CP-11:
    name: PolicySettlement
    statement: >-
      Policy.settleClaim pays the guarded payable and decreases aggregateRemaining by
      exactly that amount at most once per claim; Policy.expire is terminal after period
      end plus run-off; the deployed SureMath payable refusal branch agrees with payable.
    status: covered
    model: spec/lean/RSure/Model/Policy.lean
    soundness: RSure.Model.Policy.policy_settle_sound
    arms:
      - 'Policy@"settleClaim"'
      - 'Policy@"expire"'
      - 'Policy@"payable"'
      - 'SureMath@"payable"'
    classes: [conservation, exactly-once, terminal]
    invariants: [INV-5, INV-6, INV-8, INV-9, INV-10]
    assumptions: [ertp.native_total, deploy.atomicity, arithmetic.no_overflow]
    tie:
      status: model-only
      note: shallow Lean component model; fund lookup and line payment are abstracted here
    refinement_gap: >-
      The model proves the policy-side arithmetic and guards. Fund lookup is composed in
      Model.System. The Rholang `payable - cover.get("amount") < 0` branch is modelled by
      the `cover ≤ payable` guard; the `pay > aggregateRemaining` branch is proved
      unreachable on non-negative inputs.
