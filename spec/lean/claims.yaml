# Machine-readable claim register for the r-sure Lean component model.
#
# This is the proof-value contract. It states, for every invariant in
# spec/invariants.md, the Lean theorem that carries it, the strength of that
# theorem, and the assumptions the theorem is conditional on. It is not a
# refinement of the Rholang contracts: `proved-model` means proved about the
# shallow model in spec/lean.
#
# Status values: covered | partial | deferred | tool
# Strength values: substantive | definitional | restatement | stub | alias

schema: rsure.lean-claims/v1
review_date: 2026-11-05

assumptions:
  ertp.native_total:
    status: assumed
    note: >-
      An r-cash purse or issuer move conserves total value or fails. ERTP and
      purse custody are not modelled; every value-moving theorem is conditional
      on this boundary (INV-6, INV-8, INV-11).
  rgen.oracle_binding:
    status: assumed
    note: >-
      r-gen OracleCase.execute calls the subject's applyDecision once, for the
      named case only. The Oracle model proves the local execute-once guard; the
      binding to r-gen is an assumption.
  crypto.authority:
    status: assumed
    note: >-
      Deployer identity, policy/claim tokens and 2-of-3 signatures are
      unforgeable. The model uses opaque Nat actors and Bool possession flags.
  deploy.atomicity:
    status: assumed
    note: >-
      A failed deploy rolls back all state and value effects. The model's
      refusal steps are pure `none`; node rollback is not modelled.
  arithmetic.no_overflow:
    status: assumed
    note: >-
      Lean Nat is unbounded. The contracts use fixed-width integers; the
      arithmetic theorems are conditional on the deployed bounds.
  scheduler.fairness:
    status: out_of_scope
    note: No liveness or fairness claim is made; the model proves safety only.
  pause.contract:
    status: assumed
    note: >-
      F-003 is closed in the contracts: new-risk arms consult SureAdmin isPaused
      and fail closed. The Lean model does not prove the Rholang wiring; INV-12
      is enforced by tools/check_pause_scope.py.
  variance.estimator:
    status: assumed
    note: >-
      The quality/verdict/liability mapping is an implied variance-rate estimator, not a
      statistical moment from observed K-Asset values. The variance identities are about
      the modelled value distribution; the estimator is a boundary (INV-13).
  kasset.conventions:
    status: assumed
    note: >-
      r-gen passes quantity, quality, verdict, status and approval.liability as
      conventions, not core-enforced shapes. r-sure validates them; the K-Asset hash is a
      reference, not a recomputed state digest.
  evidence.quality:
    status: out_of_scope
    note: >-
      r-sure checks evidence presence, not probability or cost quality. Loss
      quality is an off-chain underwriting duty.
  curve.conventions:
    status: assumed
    note: >-
      The 16-point risk curve is a declared value-proposition convention. r-sure validates
      length, order, bounds and a positive sum; it does not derive the curve from observed
      values.
  curve.signal:
    status: assumed
    note: >-
      VarianceSignalBook publishes the signed gap and the reflection-invariant shape/tail
      deltas between the value curve and the loss curve. It is a market signal, not a
      pricing rule or a consensus.

invariants:
  INV-1:
    statement: committed + written <= capital and free capacity is non-negative.
    predicate: RSure.Model.Syndicate.SyndicateWF
    status: covered
    theorems:
      - {name: RSure.Model.Syndicate.synd_quote_WF, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_openLine_WF, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_release_restores, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_payLoss_preserves_free, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_written_le_capital, strength: substantive, kind: invariant}

  INV-2:
    statement: A bound slip has shares summing to 10000 bps and at least one line.
    predicate: RSure.Model.Slip.bind
    status: covered
    theorems:
      - {name: RSure.Model.Slip.slip_bind_requires_subscription, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_bind_moves, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_share_sum_bps, strength: alias, kind: projection}

  INV-3:
    statement: Line exposures sum to the aggregate; the last line absorbs the remainder.
    predicate: RSure.Model.Math.alloc
    status: covered
    note: >-
      Conditional on the contract's own `paid == amount` feasibility guard,
      represented by allocFits. The guard is checked by planBuild in the
      contract; the model does not prove feasibility from the bps sum alone.
    theorems:
      - {name: RSure.Model.Math.math_alloc_sums, strength: substantive, kind: preservation}
      - {name: RSure.Model.Distribution.distribution_plan_sums, strength: substantive, kind: preservation}

  INV-4:
    statement: commission + levy + line credits = premiumTotal.
    predicate: RSure.Model.Policy.distribute
    status: covered
    note: >-
      Conditional on brokerBps + fundBps <= 10000 and on allocFits for the line
      plan; both are the deployed contract's own guards.
    theorems:
      - {name: RSure.Model.Math.math_premiumSplit_conserves, strength: substantive, kind: preservation}
      - {name: RSure.Model.Policy.policy_distribute_conserves, strength: substantive, kind: preservation}
      - {name: RSure.Model.Policy.policy_distribute_once, strength: substantive, kind: preservation}

  INV-5:
    statement: The payable is max(0, min(agreed, perClaimLimit, aggregateRemaining) - deductible).
    predicate: RSure.Model.Math.payable
    status: covered
    note: F-020 corrected SureMath@"payable" to the documented three-way minimum.
    theorems:
      - {name: RSure.Model.Math.math_payable_le_agreed, strength: substantive, kind: bound}
      - {name: RSure.Model.Math.math_payable_le_perClaim, strength: substantive, kind: bound}
      - {name: RSure.Model.Math.math_payable_le_aggregate, strength: substantive, kind: bound}
      - {name: RSure.Model.Math.math_payable_zero_of_le_deductible, strength: substantive, kind: bound}

  INV-6:
    statement: line payouts plus the central-fund cover equal the payable.
    predicate: RSure.Model.System.system_settlement_conserves
    status: covered
    note: Conditional on the native total assumption and on the cover/payable split.
    theorems:
      - {name: RSure.Model.System.system_settlement_conserves, strength: substantive, kind: composition}
      - {name: RSure.Model.Policy.policy_settle_conserves, strength: substantive, kind: arithmetic}
      - {name: RSure.Model.Fund.fund_conserves, strength: substantive, kind: preservation}

  INV-7:
    statement: paid <= exposure and exposure is backed by written capital.
    predicate: RSure.Model.Line.LineWF
    status: covered
    note: The exposure-to-written link is the Syndicate invariant; the Line model proves the paid bound.
    theorems:
      - {name: RSure.Model.Line.line_pay_bounded, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_written_le_capital, strength: substantive, kind: invariant}

  INV-8:
    statement: A claim is paid at most once per line, per policy and per fund.
    predicate: once-per-claim guards
    status: covered
    note: Conditional on the native total assumption and on the r-gen applyDecision binding.
    theorems:
      - {name: RSure.Model.Line.line_pay_once, strength: substantive, kind: rejection}
      - {name: RSure.Model.Line.line_pay_once_per_claim, strength: substantive, kind: rejection}
      - {name: RSure.Model.Policy.policy_settle_once, strength: substantive, kind: rejection}
      - {name: RSure.Model.Fund.fund_cover_once, strength: substantive, kind: rejection}
      - {name: RSure.Model.Claim.claim_settle_once, strength: substantive, kind: rejection}
      - {name: RSure.Model.Oracle.oracle_execute_once, strength: substantive, kind: rejection}

  INV-9:
    statement: aggregateRemaining decreases by the payable and never goes negative.
    predicate: RSure.Model.Policy.settleClaim
    status: covered
    note: >-
      F-020 corrected the payable minimum and added the settleClaim guard; the
      aggregate update is now unconditional.
    theorems:
      - {name: RSure.Model.Policy.policy_settle_remaining, strength: substantive, kind: preservation}
      - {name: RSure.Model.Policy.policy_settle_aggregate, strength: substantive, kind: preservation}
      - {name: RSure.Model.Policy.policy_settle_guard, strength: substantive, kind: bound}

  INV-10:
    statement: settled/denied claims and expired policies cannot be re-opened.
    predicate: terminal guards
    status: covered
    note: >-
      F-021 added the terminal guard to Claim.agree and applyDecision; the
      contract also guards addEvidence, classify, assess and dispute.
    theorems:
      - {name: RSure.Model.Claim.claim_settle_once, strength: substantive, kind: rejection}
      - {name: RSure.Model.Claim.claim_terminal_sticky, strength: substantive, kind: rejection}
      - {name: RSure.Model.Policy.policy_terminal, strength: substantive, kind: rejection}
      - {name: RSure.Model.Claim.claim_agree_terminal, strength: substantive, kind: rejection}
      - {name: RSure.Model.Claim.claim_applyDecision_terminal, strength: substantive, kind: rejection}

  INV-11:
    statement: no partial value move survives a failed deploy.
    predicate: RSure.Model.System.transfer
    status: partial
    note: >-
      The two-cell model proves all-or-nothing and conservation, and the linear
      cell proves commit atomicity. Native ERTP value moves and node rollback are
      assumed, not proved.
    theorems:
      - {name: RSure.Model.System.system_step_atomic, strength: substantive, kind: preservation}
      - {name: RSure.Model.System.system_step_refuses, strength: substantive, kind: rejection}
      - {name: RSure.commit_all_or_none, strength: substantive, kind: preservation}
      - {name: RSure.commit_keeps_held, strength: substantive, kind: preservation}

  INV-13:
    statement: >-
      The variance of the K-Asset value is the risk of the insurance product. The rate is
      scale-free; the engineering and insurer estimates and their signed gap are recorded;
      a flagged gap is acknowledged by the insured on acceptance.
    predicate: RSure.Model.Variance.risk_is_variance
    status: covered
    note: >-
      Conditional on the K-Asset conventions and the estimator boundary. The identity is
      exact for the modelled value/loss distribution; the derived rate is an estimate.
    theorems:
      - {name: RSure.Model.Variance.risk_is_variance, strength: substantive, kind: preservation}
      - {name: RSure.Model.Variance.ssNum_reflect, strength: substantive, kind: preservation}
      - {name: RSure.Model.Variance.ssNum_shift, strength: substantive, kind: preservation}
      - {name: RSure.Model.Variance.qualityVariance_le, strength: substantive, kind: bound}
      - {name: RSure.Model.Variance.loadedPremium_ge_expected, strength: substantive, kind: bound}
      - {name: RSure.Model.Variance.gapFlag_sound, strength: substantive, kind: binding}

  INV-14:
    statement: >-
      The value curve and the loss curve are compared by the variance numerator, not the
      rate. A full-indemnity reflection or a common shift leaves the relative gap at zero;
      the curve L1 components and maximum deviation are non-negative; VarianceSignalBook
      versions a signal by the Risk nonce.
    predicate: RSure.Model.Curve.relativeVarianceGap
    status: covered
    note: >-
      Model-only: the curve is a declared convention; r-sure validates shape, order and
      bounds but does not derive it from observed values. The signal is published, not
      priced, and is not yet joined to a critical-path claim.
    theorems:
      - {name: RSure.Model.Curve.relativeVarianceGap_reflect, strength: substantive, kind: preservation}
      - {name: RSure.Model.Curve.relativeVarianceGap_shift, strength: substantive, kind: preservation}
      - {name: RSure.Model.Curve.l1Minus_nonneg, strength: substantive, kind: bound}
      - {name: RSure.Model.Curve.l1Plus_nonneg, strength: substantive, kind: bound}
      - {name: RSure.Model.Curve.maxDev_nonneg, strength: substantive, kind: bound}
      - {name: RSure.Model.Curve.signalPut_same, strength: substantive, kind: rejection}
      - {name: RSure.Model.Curve.signalPut_stale, strength: substantive, kind: rejection}
      - {name: RSure.Model.Curve.signalPut_replace, strength: substantive, kind: preservation}

  INV-12:
    statement: global pause blocks new risk without blocking settlement, close, expiry or refunds.
    predicate: pause boundary
    status: tool
    tool: tools/check_pause_scope.py
    note: >-
      F-003 is closed by the source gate: new-risk arms consult isPaused and
      fail closed, while claims, settlement, expiry and refunds stay exempt.
    theorems: []

primitives:
  CP-01:
    name: RootAuthority
    statement: >-
      SureRoot register, rotate, freeze and admin only move the component directory
      through the installer or a verified admin quorum with a strictly increasing
      governance nonce, and preserve the directory/admin authority invariant.
    status: covered
    model: spec/lean/RSure/Model/Root.lean
    soundness: RSure.Model.Root.root_register_sound
    arms:
      - 'SureRoot@"register"'
      - 'SureRoot@"rotate"'
      - 'SureRoot@"freeze"'
      - 'SureRoot@"admin"'
    classes: [authority]
    invariants: []
    assumptions: [crypto.authority, deploy.atomicity]
    tie:
      status: model-only
      note: shallow Lean component model; not a refinement of 00_root.rho
    refinement_gap: >-
      Deployer pubkey lookup, 2-of-3 signature verification and node rollback are the
      crypto.authority/deploy.atomicity boundary. The model adds `1 ≤ newVersion` to
      rotate, which the deployed arm does not check; that is a stronger model guard.
    theorems:
      - {name: RSure.Model.Root.root_register_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Root.root_rotate_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Root.root_freeze_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Root.root_admin_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Root.root_register_refuses_frozen, strength: substantive, kind: rejection}
      - {name: RSure.Model.Root.root_register_refuses_duplicate, strength: substantive, kind: rejection}
      - {name: RSure.Model.Root.root_rotate_refuses_replay, strength: substantive, kind: rejection}
      - {name: RSure.Model.Root.root_register_reachable, strength: substantive, kind: reachability}
  CP-02:
    name: AdminAuthority
    statement: >-
      AdminGuard.verify and SureAdmin.admin accept only a fresh nonce and a threshold
      of signatures; the pause flag is a truthful projection of admin state and only a
      permitted admin step can set it.
    status: covered
    model: spec/lean/RSure/Model/Admin.lean
    soundness: RSure.Model.Admin.admin_sound
    arms:
      - 'AdminGuard@"verify"'
      - 'SureAdmin@"admin"'
      - 'SureAdmin@"isPaused"'
    classes: [authority]
    invariants: [INV-12]
    assumptions: [crypto.authority, pause.contract]
    tie:
      status: model-only
      note: shallow Lean component model; the pause wiring is source-checked by unit_pause_scope
    refinement_gap: >-
      secp256k1 verification and distinct-key counting are assumed. The model does not
      prove that every new-risk Rholang arm consults isPaused; that is the pause.contract
      boundary and tools/check_pause_scope.py.
    theorems:
      - {name: RSure.Model.Admin.admin_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Admin.admin_verify_sound, strength: substantive, kind: binding}
      - {name: RSure.Model.Admin.admin_pause_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Admin.admin_isPaused_truthful, strength: substantive, kind: binding}
      - {name: RSure.Model.Admin.admin_pause_blocks_new_risk, strength: substantive, kind: invariant}
      - {name: RSure.Model.Admin.admin_refuses_replay, strength: substantive, kind: rejection}
      - {name: RSure.Model.Admin.admin_refuses_threshold, strength: substantive, kind: rejection}
      - {name: RSure.Model.Admin.admin_reachable, strength: substantive, kind: reachability}
  CP-03:
    name: PaymentsRail
    statement: >-
      Payments.issuer returns only allow-listed assets, ensureAccount registers a
      non-zero owner once and is idempotent, depositFacet is exposed only for a
      registered account on an allowed asset, and native deposits move the ledger by
      exactly the deposited amount.
    status: covered
    model: spec/lean/RSure/Model/Payments.lean
    soundness: RSure.Model.Payments.payments_deposit_conserves
    arms:
      - 'Payments@"issuer"'
      - 'Payments@"depositFacet"'
      - 'Payments@"ensureAccount"'
    classes: [authority, conservation]
    invariants: [INV-6, INV-11]
    assumptions: [ertp.native_total]
    tie:
      status: model-only
      note: shallow Lean component model; ERTP custody is not refined
    refinement_gap: >-
      Purse custody, issuer trust and ERTP native conservation are the
      ertp.native_total boundary. The ledger model proves local balance movement.
    theorems:
      - {name: RSure.Model.Payments.payments_issuer_sound, strength: substantive, kind: binding}
      - {name: RSure.Model.Payments.payments_ensureAccount_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Payments.payments_ensureAccount_idempotent, strength: substantive, kind: preservation}
      - {name: RSure.Model.Payments.payments_depositFacet_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Payments.payments_deposit_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Payments.payments_deposit_conserves, strength: substantive, kind: conservation}
      - {name: RSure.Model.Payments.payments_issuer_refuses, strength: substantive, kind: rejection}
      - {name: RSure.Model.Payments.payments_refuses_native, strength: substantive, kind: rejection}
      - {name: RSure.Model.Payments.payments_reachable, strength: substantive, kind: reachability}
  CP-04:
    name: SyndicateCapacity
    statement: >-
      A quote reserves capacity only when the manager, class and capacity guards pass;
      openLine moves reserved exposure to written without changing free capacity; and
      expireQuote only releases reserved capacity.
    status: covered
    model: spec/lean/RSure/Model/Syndicate.lean
    soundness: RSure.Model.Syndicate.synd_quote_sound
    arms:
      - 'Syndicate@"quote"'
      - 'Syndicate@"openLine"'
      - 'Syndicate@"expireQuote"'
    classes: [capacity]
    invariants: [INV-1, INV-7]
    assumptions: [deploy.atomicity]
    tie:
      status: model-only
      note: shallow Lean component model; not a refinement of 10_syndicate.rho
    refinement_gap: >-
      Purse custody and manager identity come from ERTP/authority boundaries. The model
      treats quotes as an exposure book and does not model the Rholang quote map.
    theorems:
      - {name: RSure.Model.Syndicate.synd_quote_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_quote_requires_capacity, strength: substantive, kind: bound}
      - {name: RSure.Model.Syndicate.synd_openLine_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_openLine_moves, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_expireQuote_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Syndicate.synd_quote_refuses_manager, strength: substantive, kind: rejection}
      - {name: RSure.Model.Syndicate.synd_quote_refuses_inactive, strength: substantive, kind: rejection}
      - {name: RSure.Model.Syndicate.synd_openLine_refuses_range, strength: substantive, kind: rejection}
      - {name: RSure.Model.Syndicate.synd_expireQuote_refuses_unknown, strength: substantive, kind: rejection}
      - {name: RSure.Model.Syndicate.synd_reachable, strength: substantive, kind: reachability}
  CP-05:
    name: LineGrant
    statement: >-
      LineGrant.consume succeeds only for an open grant, the holder token and the
      bound slip id, share and exposure; it moves the grant to consumed exactly once.
    status: covered
    model: spec/lean/RSure/Model/Grant.lean
    soundness: RSure.Model.Grant.grant_consume_sound
    arms:
      - 'LineGrant@"consume"'
    classes: [binding, exactly-once]
    invariants: [INV-2, INV-8]
    assumptions: [crypto.authority]
    tie:
      status: model-only
      note: shallow Lean component model; grant URI resolution is assumed
    refinement_gap: >-
      The model represents the slip token as a Boolean holder check. Token identity
      and URI resolution are assumed.
    theorems:
      - {name: RSure.Model.Grant.grant_consume_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Grant.grant_binding, strength: substantive, kind: binding}
      - {name: RSure.Model.Grant.grant_consume_once_bound, strength: substantive, kind: rejection}
      - {name: RSure.Model.Grant.grant_consume_refuses_closed, strength: substantive, kind: rejection}
      - {name: RSure.Model.Grant.grant_consume_refuses_holder, strength: substantive, kind: rejection}
      - {name: RSure.Model.Grant.grant_consume_refuses_mismatch, strength: substantive, kind: rejection}
      - {name: RSure.Model.Grant.grant_reachable, strength: substantive, kind: reachability}
  CP-06:
    name: SlipSubscription
    statement: >-
      Slip.accept is owner-gated to an open or subscribed slip; Slip.subscribe appends a
      bounded share only when a grant accepted the subscription.
    status: covered
    model: spec/lean/RSure/Model/Slip.lean
    soundness: RSure.Model.Slip.slip_accept_sound
    arms:
      - 'Slip@"accept"'
      - 'Slip@"subscribe"'
    classes: [authority, binding]
    invariants: [INV-2]
    assumptions: [crypto.authority]
    tie:
      status: model-only
      note: shallow Lean component model; the syndicate grant is abstracted
    refinement_gap: >-
      The model keeps share rates, not syndicate URIs, and abstracts the grant returned
      by Slip.subscribe into a Boolean acceptance.
    theorems:
      - {name: RSure.Model.Slip.slip_accept_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_subscribe_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_accept_refuses_owner, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_subscribe_refuses_share, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_reachable, strength: substantive, kind: reachability}
  CP-07:
    name: SlipFunding
    statement: >-
      Slip.fundPremium credits the insured's premium locally and Slip.expire refunds
      exactly the funded amount; a bound slip cannot expire.
    status: covered
    model: spec/lean/RSure/Model/Slip.lean
    soundness: RSure.Model.Slip.slip_fund_sound
    arms:
      - 'Slip@"fundPremium"'
      - 'Slip@"expire"'
    classes: [conservation, terminal]
    invariants: [INV-2, INV-10]
    assumptions: [ertp.native_total]
    tie:
      status: model-only
      note: shallow Lean component model; the refund move is ERTP
    refinement_gap: >-
      The native deposit and refund moves are the ertp.native_total boundary. The model
      records the funded counter and refund credit.
    theorems:
      - {name: RSure.Model.Slip.slip_fund_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_expire_refund, strength: substantive, kind: conservation}
      - {name: RSure.Model.Slip.slip_expire_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_fund_refuses_owner, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_fund_refuses_amount, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_expire_refuses_bound, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_fund_reachable, strength: substantive, kind: reachability}
  CP-08:
    name: SlipBinding
    statement: >-
      Slip.bind succeeds only when the insured has accepted, the premium is fully
      funded, at least one share exists and the shares sum to 10000 bps; a bound slip
      carries that subscription invariant.
    status: covered
    model: spec/lean/RSure/Model/Slip.lean
    soundness: RSure.Model.Slip.slip_bind_sound
    arms:
      - 'Slip@"bind"'
    classes: [binding]
    invariants: [INV-2, INV-3, INV-4]
    assumptions: [deploy.atomicity]
    tie:
      status: model-only
      note: shallow Lean component model; policy/line creation is not refined
    refinement_gap: >-
      The model proves the bind guards and status move, not the Rholang creation of the
      policy, lines and distribution; those are covered separately by CP-09/CP-10/CP-11.
    theorems:
      - {name: RSure.Model.Slip.slip_bind_sound, strength: substantive, kind: preservation}
      - {name: RSure.Model.Slip.slip_bind_requires_subscription, strength: substantive, kind: binding}
      - {name: RSure.Model.Slip.slip_bind_refuses_unaccepted, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_bind_refuses_funding, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_bind_refuses_shares, strength: substantive, kind: rejection}
      - {name: RSure.Model.Slip.slip_reachable, strength: substantive, kind: reachability}
  CP-09:
    name: LineSettlement
    statement: >-
      Line.pay pays a claim at most once per line and never beyond exposure;
      Line.release returns the unpaid exposure; Line.credit records a local credit whose
      native conservation is conditional on ertp.native_total.
    status: covered
    model: spec/lean/RSure/Model/Line.lean
